# Extra lint rules, for this module only.
#
# The tree's root ruff.toml is generated by Odoo's runbot and must not be
# hand-edited, so the module carries its own config instead: ruff resolves the
# nearest one per file, and `extend` inherits the whole generated rule set. Odoo
# core keeps the generated rules untouched.
#
# What is added: the code here is written by an agent from a natural-language
# ticket, so the two families worth having are the ones that catch defects
# rather than style -- flake8-bandit (S) for security and flake8-bugbear (B)
# for bugs. Neither is enabled upstream.
#
# Selectors are written as rule *names*, not codes: ruff lints its own config
# and RUF201 rejects codes here. Prefixes ("S", "B") stay as prefixes.
extend = "../../ruff.toml"

[lint]
extend-select = [
    "B",          # flake8-bugbear
    "S",          # flake8-bandit
]
extend-ignore = [
    # Matches on the *name* of a variable, so it cannot tell a config key from a
    # secret. Every hit in this module was a false positive: the name of an
    # ir.config_parameter key, two parser tokens, two test fixtures. S106 and
    # S107 -- secrets passed as arguments -- stay on, and those do read values.
    "hardcoded-password-string",
]

[lint.extend-per-file-ignores]
# An Odoo manifest *is* a bare dict literal; that is the required format.
"__manifest__.py" = ["useless-expression"]
# Build helpers, not module runtime: they launch a headless browser with a fixed
# argv list (no shell=True, no user input) to render the App Store banner.
"static/description/*.py" = [
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
]
