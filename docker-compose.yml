services:
  odoo:
    build: .
    container_name: odoo19
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8069:8069"
    volumes:
      - ./custom_addons:/opt/odoo/custom_addons
    # Local dev only: reach Warden's Magento (https://app.ituc.test), which is
    # served by the host's Traefik. Harmless in prod, where the DNS resolves.
    extra_hosts:
      - "app.ituc.test:host-gateway"
      - "app.alcivet.test:host-gateway"
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odoo.rule=Host(`odoo.sebastianartaza.com`)"
      - "traefik.http.routers.odoo.entrypoints=web"

  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  odoo-db-data:

networks:
  traefik:
    external: true
  internal:
    driver: bridge
