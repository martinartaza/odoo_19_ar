# The compose project name, pinned. Left implicit it comes from the directory
# name, which also prefixes every named volume -- so moving or renaming the
# checkout would silently create fresh empty volumes and look like data loss.
name: odoo_19_ar

services:
  odoo:
    build: .
    container_name: odoo19
    depends_on:
      - db
    env_file:
      - .env
    ports:
      # Bound to loopback on purpose: reachable from the host for development
      # and for debugging on the server, never published to the internet.
      # Traefik reaches the container over the `traefik` network, not through
      # this mapping.
      # *_HOST_PORT is the port published on the host, and is deliberately not
      # DB_PORT: entrypoint.sh already uses DB_HOST/DB_PORT for the connection
      # *inside* the container (db:5432). Reusing one name for both meanings
      # wrote the host's port into odoo.conf and left staging unable to reach
      # its own database.
      - "127.0.0.1:${ODOO_HOST_PORT:-8069}:8069"
    volumes:
      - ./custom_addons:/opt/odoo/custom_addons
      # The filestore MUST be a named volume. Without it, attachments and
      # product images live inside the container and are lost the moment it is
      # recreated -- which is every deploy. Production had this fix applied by
      # hand and uncommitted; that is how it nearly got lost.
      - odoo-filestore:/var/lib/odoo
    # Local dev only: reach Warden's Magento (https://app.ituc.test), which is
    # served by the host's Traefik. Harmless in prod, where the DNS resolves.
    extra_hosts:
      - "app.ituc.test:host-gateway"
      - "app.alcivet.test:host-gateway"
    networks:
      - traefik
      - internal
    labels:
      # Defaults are production's values, so a `git pull` on the server changes
      # nothing. Override in .env for anything else.
      - "traefik.enable=true"
      - "traefik.http.routers.odoo.rule=Host(`${ODOO_HOSTNAME:-odoo.artaza.net}`)"
      - "traefik.http.routers.odoo.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.odoo.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.odoo.loadbalancer.server.port=8069"

  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - internal

volumes:
  odoo-db-data:
  odoo-filestore:

networks:
  traefik:
    external: true
  internal:
    driver: bridge
